# Publish an already released npm version to the MCP Registry explicitly.
#
# GitHub source releases can precede npm publication. Run this workflow only
# after the matching npm package exists; its ownership metadata is required
# by the registry. Select an existing stable release tag.
name: Publish to MCP Registry

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag whose package is already published on npm"
        required: true
        type: string
        default: "v2.0.1"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Check the tag matches the manifests
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Select an existing stable version tag such as v2.0.0."
            exit 1
          fi
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          TAG="${RELEASE_TAG#v}"
          PKG=$(node -p "require('./package.json').version")
          SRV=$(node -p "require('./server.json').version")
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$SRV" ]; then
            echo "Tag v$TAG, package.json $PKG, server.json $SRV. All three must match."
            exit 1
          fi

      - name: Check the npm release exists
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "$NAME@$VERSION" mcpName 2>/dev/null || true)
          if [ -z "$PUBLISHED" ]; then
            echo "$NAME@$VERSION is not on npm, or carries no mcpName."
            echo "Publish to npm first: the registry reads mcpName from the published package."
            exit 1
          fi

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate with the getmcpads.com domain
        run: ./mcp-publisher login dns --domain getmcpads.com --private-key "${{ secrets.MCP_DNS_PRIVATE_KEY }}"

      - name: Publish, unless this version is already listed
        run: |
          NAME=$(node -p "require('./server.json').name")
          VERSION=$(node -p "require('./server.json').version")
          LISTED=$(curl -sf "https://registry.modelcontextprotocol.io/v0.1/servers?search=$NAME" \
            | node -e "
              let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                const servers=(JSON.parse(s).servers||[]);
                const hit=servers.some(x=>(x.server||x).name==='$NAME'&&(x.server||x).version==='$VERSION');
                console.log(hit?'yes':'no');
              })" || echo "no")
          if [ "$LISTED" = "yes" ]; then
            echo "$NAME $VERSION is already in the registry. Nothing to do."
            exit 0
          fi
          ./mcp-publisher publish
